[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aircommand"
version = "0.1.0"
description = "Wifi-auditing orchestrator wrapping aircrack-ng, hashcat, and nmap"
requires-python = ">=3.12"
dependencies = [
    "customtkinter>=5.2",
]

[project.scripts]
aircommand = "aircommand.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["aircommand*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

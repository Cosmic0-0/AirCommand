[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aircommand"
version = "0.1.0"
description = "Wifi-auditing orchestrator wrapping aircrack-ng, hashcat, and nmap"
requires-python = ">=3.12"
dependencies = [
    "PySide6-Essentials>=6.12",
]

[project.scripts]
aircommand = "aircommand.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.5",
]

[tool.setuptools.packages.find]
include = ["aircommand*"]

[tool.setuptools.package-data]
"aircommand.gui" = ["fonts/*.ttf", "fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
